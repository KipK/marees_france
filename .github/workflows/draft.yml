name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject release version into manifest.json
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          jq --arg v "$CLEAN_VERSION" '.version = $v' \
            custom_components/marees_france/manifest.json > manifest.tmp \
            && mv manifest.tmp custom_components/marees_france/manifest.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run lint && npm run build

      - name: Create ZIP archive
        run: mkdir -p tmp_dist && cd custom_components/marees_france/ && zip -r ../../tmp_dist/marees_france.zip .

      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: tmp_dist/marees_france.zip